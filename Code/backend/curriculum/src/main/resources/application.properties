spring.application.name=curriculum

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/curriculum_iu?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080


# =========================================================
# JWT / NFR-03.3
# =========================================================

jwt.secret=7c9d4f0a2b1e8f5d9a6c3e1f4b8a9d2c5f7e1a3b6d9c2e8f12345678duongbacamly@123

# Access token = 24 hours
jwt.expiration-ms=86400000

# Refresh token = 7 days
jwt.refresh-expiration-ms=604800000

# Local development uses HTTP.
# Production should set:
# REFRESH_COOKIE_SECURE=true
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}


# =========================================================
# NFR-03.6 - HTTPS Enforcement
# =========================================================

# Local:
# REQUIRE_HTTPS=false
#
# Production:
# REQUIRE_HTTPS=true
app.security.require-https=${REQUIRE_HTTPS:false}

# Required when the application runs behind
# Nginx / reverse proxy / load balancer.
server.forward-headers-strategy=framework


# =========================================================
# GOOGLE WORKSPACE SSO
# =========================================================

# Google Cloud Console:
# OAuth 2.0 Client IDs -> Web client
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# Leave blank if domain restriction is not required.
google.oauth.allowed-domain=${GOOGLE_ALLOWED_DOMAIN:}


# =========================================================
# FR-05.4
# Email Notification / Transactional Outbox
# =========================================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@scse.local}
app.mail.from-name=${MAIL_FROM_NAME:SCSE Curriculum Management}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.mail.batch-size=${MAIL_BATCH_SIZE:25}
app.mail.max-retries=${MAIL_MAX_RETRIES:5}
app.mail.dispatch-interval-ms=${MAIL_DISPATCH_INTERVAL_MS:5000}
app.mail.initial-delay-ms=${MAIL_INITIAL_DELAY_MS:3000}

# FR-05.4 diagnostics
logging.level.com.scse.curriculum.email=INFO


# =========================================================
# FR-05.6
# Semester Deadline & Reminder
# =========================================================

app.deadline-reminder.enabled=${DEADLINE_REMINDER_ENABLED:true}
app.deadline-reminder.startup-check=${DEADLINE_REMINDER_STARTUP_CHECK:true}

app.deadline-reminder.zone=${DEADLINE_REMINDER_ZONE:Asia/Ho_Chi_Minh}

# Every day at 08:00
app.deadline-reminder.cron=${DEADLINE_REMINDER_CRON:0 0 8 * * *}

logging.level.com.scse.curriculum.deadline=INFO


# =========================================================
# FR-01.7
# Immutable Audit Trail
# =========================================================

app.audit.system-username=${AUDIT_SYSTEM_USERNAME:system}


# =========================================================
# FR-05.7
# Automatic Deadline Escalation
# =========================================================

app.deadline-escalation.enabled=${DEADLINE_ESCALATION_ENABLED:true}
app.deadline-escalation.startup-check=${DEADLINE_ESCALATION_STARTUP_CHECK:true}

app.deadline-escalation.zone=${DEADLINE_ESCALATION_ZONE:Asia/Ho_Chi_Minh}

# Every hour at minute 15
app.deadline-escalation.cron=${DEADLINE_ESCALATION_CRON:0 15 * * * *}


# =========================================================
# FR-03.11 / FR-07.4
# Syllabus PDF Generation
# =========================================================

app.pdf.font.regular=${PDF_FONT_REGULAR:}
app.pdf.font.bold=${PDF_FONT_BOLD:}

app.pdf.institution-name=${PDF_INSTITUTION_NAME:VIETNAM NATIONAL UNIVERSITY HCMC - INTERNATIONAL UNIVERSITY}
app.pdf.school-name=${PDF_SCHOOL_NAME:SCHOOL OF COMPUTER SCIENCE AND ENGINEERING}


# =========================================================
# NFR-01.5
# Concurrent Users Monitoring
# =========================================================

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}


# =========================================================
# NFR-05.1
# Swagger / OpenAPI Documentation
# =========================================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true