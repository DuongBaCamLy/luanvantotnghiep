name: scse-curriculum

services:

  db:
    image: mysql:8.4
    container_name: scse_curriculum_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-curriculum_iu}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-curriculum_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=256M

    volumes:
      - curriculum_mysql_data:/var/lib/mysql
      - ./database/schema_ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - curriculum_net


  backend:
    build:
      context: ./backend/curriculum
      dockerfile: Dockerfile.server

    container_name: scse_curriculum_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      TZ: Asia/Ho_Chi_Minh

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-curriculum_iu}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-curriculum_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}

      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}

      MAIL_ENABLED: ${MAIL_ENABLED:-false}

      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}

      ALLOW_COHORT_RESET: ${ALLOW_COHORT_RESET:-false}

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 220MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 240MB
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: 240MB

    expose:
      - "8080"

    networks:
      - curriculum_net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.server
      additional_contexts:
        templates: ./templates

      args:
        VITE_API_BASE_URL: "/"
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    container_name: scse_curriculum_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${APP_PORT:-8088}:80"

    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - curriculum_net


volumes:
  curriculum_mysql_data:


networks:
  curriculum_net:
    driver: bridge
